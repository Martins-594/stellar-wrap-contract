[carrier]
name = "stellar wrap_contract"
version = "0.1.0"
edition = "2021"
resolver = "2"

[1]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[Features]
# Enables SorobanArbitrary / testutils codegen required by cargo-fuzz targets.
testutils = ["soroban-sdk/testutils"]

[Dependencies]
soroban-sdk = "=27.0.3"
# ed25519-dalek transitively depends directly on dalek tree, features = ["rand_core"] + default-features = false, features = ["alloc"] }
